version: '3.8'  # Specify the version of Docker Compose

services:
  web:
    build:
      context: .  # Current directory as build context
      dockerfile: Dockerfile  # Ensure the Dockerfile is named correctly
    container_name: trashapi-web
    ports:
      - "80:8000"  # Map port 80 on the host to port 8000 in the container
    restart: always  # Ensure the web service restarts automatically
    networks:
      - webnet
    environment:
      - CHANNEL_LAYERS_BACKEND=channels_redis.core.RedisChannelLayer
      - CHANNEL_LAYERS_CONFIG_HOST=redis  # Use internal Redis service
      - CHANNEL_LAYERS_CONFIG_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0  # Internal Redis URL

  redis:
    image: redis:latest  # Use the official Redis image
    container_name: redis
    ports:
      - "6379:6379"  # Map port 6379 on the host to port 6379 in the container
    restart: always  # Ensure Redis restarts automatically
    networks:
      - webnet

  postgres:
    image: postgres:latest  # Use the official PostgreSQL image
    container_name: trashapi-postgres
    environment:
      POSTGRES_DB: Customers  # Database name
      POSTGRES_USER: Trashandler  # Username
      POSTGRES_PASSWORD: Trashandler  # Password
      POSTGRES_LOGGING_CONFIG: |
        log_destination = 'stderr'
        logging_collector = 'on'
        log_directory = 'pg_log'
        log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
        log_rotation_age = '1d'  # Rotate logs daily
        log_rotation_size = '0'  # Disable size-based rotation
        log_statement = 'all'  # Log all statements
    ports:
      - "5432:5432"  # Expose PostgreSQL port
    restart: always  # Ensure PostgreSQL restarts automatically
    networks:
      - webnet
    volumes:
      - pg_log:/var/lib/postgresql/data/pg_log  # Mount for logs

  celery_worker:
    build:
      context: .  # Current directory as build context
      dockerfile: Dockerfile  # Ensure the Dockerfile is named correctly
    container_name: trashapi-celery
    command: celery -A trashapi worker --loglevel=info -P solo  # Command to run Celery worker
    depends_on:
      - redis  # Ensure Redis is started before the Celery worker
      - postgres  # Ensure PostgreSQL is started before the Celery worker
    restart: always  # Ensure the Celery worker restarts automatically
    networks:
      - webnet
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0  # Internal Redis URL
      - CHANNEL_LAYERS_BACKEND=channels_redis.core.RedisChannelLayer
      - CHANNEL_LAYERS_CONFIG_HOST=redis  # Internal Redis service
      - CHANNEL_LAYERS_CONFIG_PORT=6379

  celery_beat:
    build:
      context: .  # Current directory as build context
      dockerfile: Dockerfile  # Ensure the Dockerfile is named correctly
    container_name: trashapi-celery-beat
    command: celery -A trashapi beat -l info  # Command to run Celery beat
    depends_on:
      - redis  # Ensure Redis is started before Celery beat
      - postgres  # Ensure PostgreSQL is started before Celery beat
    restart: always  # Ensure the Celery beat restarts automatically
    networks:
      - webnet
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0  # Internal Redis URL
      - CHANNEL_LAYERS_BACKEND=channels_redis.core.RedisChannelLayer
      - CHANNEL_LAYERS_CONFIG_HOST=redis  # Internal Redis service
      - CHANNEL_LAYERS_CONFIG_PORT=6379

  kafka_consumer:
    build:
      context: .  # Current directory as build context
      dockerfile: Dockerfile  # Ensure the Dockerfile is named correctly
    container_name: trashapi-kafka-consumer
    command: python manage.py run_kafka_consumer  # Command to run Kafka consumer
    restart: always  # Ensure Kafka consumer restarts automatically
    networks:
      - webnet  # Include the same network for communication between services
    environment:
      - CHANNEL_LAYERS_BACKEND=channels_redis.core.RedisChannelLayer
      - CHANNEL_LAYERS_CONFIG_HOST=redis  # Internal Redis service
      - CHANNEL_LAYERS_CONFIG_PORT=6379

volumes:
  pg_log:  # Define a volume for PostgreSQL logs

networks:
  webnet:
